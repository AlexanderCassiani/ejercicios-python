<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Adivina el numero</title>
    <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}" />
  </head>
  <body>
    <main>
      <h1>Adivina el numero</h1>
      <div class="contenedor">
        <p id="mensaje"></p>
        <p id="intentos"></p>

        <div class="contenedor-input">
          <input
            type="text"
            maxlength="3"
            id="numero"
            placeholder="Tu número"
            required
          />
          <button id="btnAdivinar">Adivinar</button>
        </div>

        <button id="btnReiniciar">Reiniciar</button>
      </div>
    </main>

    <div id="modalFinal" class="modal" hidden>
      <section
        class="modal-contenido"
        role="dialog"
        aria-modal="true"
        aria-labelledby="titulo-modal"
        aria-describedby="mensaje-modal"
      >
        <h2 id="titulo-modal">¡Felicidades!</h2>
        <p id="mensaje-modal">Adivinaste el numero</p>
        <button id="btnReiniciarModal" type="button">Jugar otra vez</button>
      </section>
    </div>

    <script src="{{url_for('static', filename='script.js')}}"></script>
  </body>
</html>
